[project]
name = "ins-gnss-fusion"
version = "0.1.0"
description = "Loosely coupled 3D INS/GNSS navigation: 15-state error-state Kalman filter, static alignment, GNSS outlier gating and Monte Carlo consistency analysis"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
insgnss = "insgnss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insgnss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
